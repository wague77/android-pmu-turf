name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              echo "package-lock.json trouvé -> npm ci"
              npm ci
            else
              echo "package.json trouvé -> npm install"
              npm install
            fi
          elif [ -f pubspec.yaml ]; then
            echo "Projet Flutter détecté (pubspec.yaml)"
          else
            echo "Création d'un package.json de secours..."
            printf '{"name":"android-project","version":"1.0.0","private":true,"scripts":{"build":"mkdir -p dist && cp -r src/* dist/ 2>/dev/null || true && cp index.html dist/ 2>/dev/null || true"}}\n' > package.json
          fi

      - name: Build Web Application
        run: |
          if [ -f package.json ] && grep -q '"build":' package.json; then
            echo "Exécution du build web..."
            npm run build || true
          fi

      - name: Copy Web Build to Android Assets
        run: |
          if [ -d android ]; then
            mkdir -p android/app/src/main/assets/public
            if [ -d dist ] && [ "$(ls -A dist 2>/dev/null)" ]; then
              cp -r dist/* android/app/src/main/assets/public/ || true
            elif [ -d build ] && [ "$(ls -A build 2>/dev/null)" ]; then
              cp -r build/* android/app/src/main/assets/public/ || true
            fi
            if [ ! -f android/app/src/main/assets/public/index.html ]; then
              if [ -f index.html ]; then
                cp index.html android/app/src/main/assets/public/
              elif [ -f public/index.html ]; then
                cp public/index.html android/app/src/main/assets/public/
              else
                printf '<!doctype html><html><head><meta charset="utf-8"><title>App</title></head><body><div id="root"><h1>Application</h1></div></body></html>\n' > android/app/src/main/assets/public/index.html
              fi
            fi
          fi

      - name: Set up Flutter (si projet Flutter)
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        if: hashFiles('pubspec.yaml') != ''
        run: flutter pub get

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Prepare Android Keystore and Fix Resources
        run: |
          if [ -d android ]; then
            cd android

            echo "=== Diagnostic Version Gradle ==="
            gradle --version || true

            # 1. Configurer impérativement le Gradle Wrapper 8.5
            mkdir -p gradle/wrapper
            cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

            # Régénérer le wrapper exécutable compatible 8.5
            gradle wrapper --gradle-version 8.5 --distribution-type bin || true
            chmod +x ./gradlew || true

            # 2. Nettoyer flatDir et configurations orphelines dans app/build.gradle
            if [ -f app/build.gradle ]; then
              sed -i '/flatDir/,/}/d' app/build.gradle || true
            fi

            # 3. Garantir la présence des fichiers XML de ressources critiques pour AAPT2
            mkdir -p app/src/main/res/xml app/src/main/res/drawable app/src/main/res/values

            if [ ! -f app/src/main/res/xml/file_paths.xml ]; then
              echo "Création de file_paths.xml..."
              cat << 'EOF' > app/src/main/res/xml/file_paths.xml
<?xml version="1.0" encoding="utf-8"?>
<paths xmlns:android="http://schemas.android.com/apk/res/android">
    <external-path name="my_images" path="." />
    <external-cache-path name="my_cache" path="." />
    <cache-path name="cache" path="." />
    <files-path name="files" path="." />
</paths>
EOF
            fi

            if [ ! -f app/src/main/res/drawable/ic_launcher_foreground.xml ]; then
              echo "Création de ic_launcher_foreground.xml..."
              cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path
        android:fillColor="#FFFFFF"
        android:pathData="M54,22 C36.3,22 22,36.3 22,54 C22,71.7 36.3,86 54,86 C71.7,86 86,71.7 86,54 C86,36.3 71.7,22 54,22 Z M47,68 L33,54 L40.2,49.8 L48,57.6 L70.8,35.8 L75,40 L47,68 Z"/>
</vector>
EOF
            fi

            if [ ! -f app/src/main/res/drawable/ic_launcher_background.xml ]; then
              echo "Création de ic_launcher_background.xml..."
              cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path
        android:fillColor="#4F46E5"
        android:pathData="M0,0h108v108h-108z"/>
</vector>
EOF
            fi

            # 4. Créer le keystore de signature release s'il est absent
            mkdir -p app/libs
            if [ ! -f app/release.keystore ] && [ ! -f release.keystore ]; then
              echo "Génération automatique du keystore release Android..."
              keytool -genkeypair -v \
                -keystore app/release.keystore \
                -alias release-key \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass nova2026pass \
                -keypass nova2026pass \
                -dname "CN=NOVA Mobile, OU=Mobile, O=NOVA Studio, L=Paris, ST=IDF, C=FR"
            fi

            cd ..
          fi

      - name: Build APK and AAB
        run: |
          if [ -f pubspec.yaml ]; then
            echo "Compilation avec Flutter..."
            flutter build apk --release
            flutter build appbundle --release
          elif [ -d android ]; then
            echo "Compilation avec Gradle 8.5..."
            cd android
            chmod +x ./gradlew || true

            echo "=== Compilation de l'APK (Release / Debug) ==="
            ./gradlew assembleRelease --no-daemon --stacktrace || \
            gradle assembleRelease --no-daemon --stacktrace || \
            ./gradlew assembleDebug --no-daemon --stacktrace || \
            gradle assembleDebug --no-daemon --stacktrace

            echo "=== Compilation du bundle AAB (Google Play Store) ==="
            ./gradlew bundleRelease --no-daemon --stacktrace || \
            gradle bundleRelease --no-daemon --stacktrace || \
            ./gradlew bundleDebug --no-daemon --stacktrace || \
            gradle bundleDebug --no-daemon --stacktrace || true

            cd ..
          else
            echo "Aucun dossier Android ou Flutter trouvé."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            build/app/outputs/bundle/**/*.aab
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/debug/*.aab
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
